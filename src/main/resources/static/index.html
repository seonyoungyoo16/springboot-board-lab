<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spring Boot Board Lab</title><link rel="stylesheet" href="/board.css"></head><body><main><header><span>SPRING BOOT / JPA / H2</span><h1>Board Lab</h1><p>실제 API와 DB로 동작하는 게시판</p><label>데모 사용자 <select id="actor"><option value="1">데모 작성자</option><option value="2">데모 방문자</option></select></label></header><div id="notice" role="status"></div><div class="columns"><section><h2>글 목록</h2><button id="new">새 글 작성</button><div id="posts"></div></section><section><form id="post-form"><input name="title" id="title" placeholder="제목" maxlength="120" required aria-label="제목"><textarea name="body" id="body" placeholder="본문" maxlength="10000" required aria-label="본문"></textarea><label id="image-field">이미지 (PNG/JPEG · 2MB · 4096×4096 이하)<input id="image" type="file" accept="image/png,image/jpeg" aria-label="첨부 이미지"></label><button>저장</button><button type="button" id="cancel">취소</button></form><article id="detail"></article></section></div><footer>사용자 선택은 권한 규칙을 확인하는 데모입니다. 실제 로그인 인증 기능은 포함하지 않습니다.</footer></main><script type="module" src="/board.js"></script></body></html>
